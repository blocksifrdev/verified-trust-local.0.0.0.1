---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-deployer
  namespace: production
  labels:
    app: sample-app
    managed-by: terraform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-deployer-cluster-admin
subjects:
  - kind: ServiceAccount
    name: app-deployer
    namespace: production
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
